# CI bootstraps this mise version, then reads every tool pin from this file.
min_version = "2026.11.1"

[tools]
"github:jdx/mise" = "2026.11.1"
"github:jdx/hk" = "2.11.1"
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"] }
node = "24.22.2"
# Acceptance/release tooling uses 3.12; the agent generator requires python3.14.
python = ["3.12.16", "3.14.10"]
"github:bnjbvr/cargo-machete" = "0.9.2"
ruff = "0.17.3"
oxlint = "1.91.0"
"npm:oxfmt" = "0.76.0"
"github:jdx/jactionlint" = "2.4.0"
"aqua:betterleaks/betterleaks" = "1.9.0"
"aqua:google/osv-scanner" = "2.7.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.check]
description = "Complete CI gate, including lockfile vulnerabilities"
depends = ["check:offline", "check:security"]

[tasks."check:offline"]
description = "Whole-project checks without vulnerability database requests"
depends = ["check:lint", "check:secrets", "check:python", "check:release"]

[tasks."check:lint"]
description = "Run the shared hook checks across the whole project"
run = "hk check --all"

[tasks."check:rust"]
description = "Rust formatting, Clippy, tests, and acceptance-test build"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo test --locked",
  "cargo build --locked",
]

[tasks."check:python"]
description = "Python acceptance tests against the freshly built CLI"
depends = ["check:rust"]
run = "python -m unittest discover -s tests -v"

[tasks."check:release"]
description = "JavaScript release-tooling tests"
run = "npm run test:release"

[tasks."check:machete"]
description = "Find unused Rust dependencies"
run = "cargo-machete"

[tasks."check:security"]
description = "Scheduled vulnerabilities and workflow policy, including exception expiry"
depends = ["check:osv", "check:workflows"]

[tasks."check:workflows"]
description = "Run the shared workflow policy and expiring-exception gate"
run = "hk check --all --step jactionlint"

[tasks."check:osv"]
description = "Scan both dependency lockfiles using current OSV data"
run = "osv-scanner scan source --lockfile=Cargo.lock --lockfile=package-lock.json"

[tasks."check:secrets"]
description = "Scan tracked working-tree files without reading ignored local files"
# Filter before hk expands directory arguments, including symlinks to directories.
# hk handles batching and empty input; pipefail propagates enumeration failures.
shell = "bash -o pipefail -c"
run = '''
git ls-files --cached --deduplicate -z |
  while IFS= read -r -d '' path; do
    if [[ -f "$path" && ! -L "$path" ]]; then
      printf '%s\0' "$path"
    fi
  done |
  hk run secrets-worktree --files0-from -
'''

[tasks."check:commits"]
alias = ["commitlint"]
description = "Shared Commitlint command; pass --edit, --from/--to, or --last"
raw_args = true
run = "npm run commitlint --"

[tasks.fix]
description = "Apply shared safe fixes to modified files"
run = "hk fix"

[tasks."hooks:install"]
description = "Install repository Git hooks using the pinned mise environment"
run = "hk install --mise"
