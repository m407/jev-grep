name: Conventional Commits

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - run: npm ci
      - name: Validate PR title (squash commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | mise run check:commits -- --verbose
      - name: Validate PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise run check:commits -- --from "$BASE" --to "$HEAD" --verbose
