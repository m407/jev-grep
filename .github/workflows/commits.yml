name: Conventional Commits

on:
  workflow_call:
    inputs:
      pr_title:
        description: Pull request title to validate as the squash commit
        type: string
        required: true
      base_sha:
        description: Pull request base commit SHA
        type: string
        required: true
      head_sha:
        description: Exact pull request head commit SHA
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.11.1'
          cache: false
      - run: npm ci
      - name: Validate PR title (squash commit)
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: printf '%s\n' "$PR_TITLE" | mise run check:commits -- --verbose
      - name: Validate PR commits
        env:
          BASE: ${{ inputs.base_sha }}
          HEAD: ${{ inputs.head_sha }}
        run: mise run check:commits -- --from "$BASE" --to "$HEAD" --verbose
