name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/commits.yml

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - run: npm ci
      - name: Check commit messages
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            mise run check:commits -- --last --verbose
          else
            mise run check:commits -- --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          fi
      - name: Validate
        run: mise run check

  plan:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: node
    permissions:
      # semantic-release verifies push access even in dry-run mode.
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - run: npm ci
      - id: release
        run: npm run release:plan
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: jev-grep
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: jev-grep
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: jev-grep.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: rust,python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python scripts/set-release-version.py "$RELEASE_VERSION"
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: mise exec -- rustup target add --toolchain "$(mise current rust)" "$TARGET"
      - name: Build and smoke-test
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cargo build --release --locked --target "$TARGET"
          test "$("target/$TARGET/release/$BINARY" --version)" = "jev-grep $RELEASE_VERSION"
          "target/$TARGET/release/$BINARY" --help
      - name: Package
        env:
          TAG: v${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          target, binary = os.environ['TARGET'], os.environ['BINARY']
          name = f"jev-grep-{os.environ['TAG']}-{target}"
          Path('dist').mkdir()
          files = [(Path('target') / target / 'release' / binary, binary),
                   (Path('README.md'), 'README.md')]
          if binary.endswith('.exe'):
              with zipfile.ZipFile(f'dist/{name}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path, member in files:
                      archive.write(path, arcname=member)
          else:
              with tarfile.open(f'dist/{name}.tar.gz', 'w:gz') as archive:
                  for path, member in files:
                      archive.add(path, arcname=member)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: node,python
    permissions:
      # Publish the version commit, tag, and GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: npm run release
