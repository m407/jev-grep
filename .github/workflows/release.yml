name: Release
run-name: >-
  ${{ inputs.verify_builds && format('Verify builds - {0} @ {1}', github.ref_name, github.sha) || inputs.release_pr != '' && format('Release validation PR #{0} @ {1}', inputs.release_pr, inputs.release_sha) || format('Release - {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      verify_builds:
        description: Read-only three-platform build verification on the selected ref
        type: boolean
        required: false
        default: false
      release_pr:
        description: Release PR number to validate
        type: string
        required: false
        default: ''
      release_sha:
        description: Exact release PR head SHA to validate
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      MISE_ENABLE_TOOLS: node,python
    outputs:
      check_sha: ${{ steps.context.outputs.check_sha }}
      version: ${{ steps.context.outputs.version }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      pr_title: ${{ steps.context.outputs.pr_title }}
      base_sha: ${{ steps.context.outputs.base_sha }}
      head_sha: ${{ steps.context.outputs.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - name: Resolve and validate workflow context
        id: context
        run: node scripts/release.mjs context
        env:
          GITHUB_TOKEN: ${{ github.token }}

  commitlint:
    needs: context
    if: ${{ !inputs.verify_builds && needs.context.outputs.pr_number != '' }}
    uses: ./.github/workflows/commits.yml
    with:
      pr_title: ${{ needs.context.outputs.pr_title }}
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}

  check:
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.check_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - run: npm ci
      - name: Check commit messages
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            mise run check:commits -- --last --verbose
          else
            mise run check:commits -- --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          fi
      - name: Validate
        run: mise run check

  prepare:
    needs: [context, check, commitlint]
    if: >-
      always() && !cancelled() && !inputs.verify_builds && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && needs.check.result == 'success' &&
      (needs.commitlint.result == 'success' || needs.commitlint.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: node,python
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
      release_pr_number: ${{ steps.release.outputs.release_pr_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.check_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - run: npm ci
      - id: release
        run: npm run release:prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-check:
    needs: prepare
    if: >-
      always() && !cancelled() && !inputs.verify_builds &&
      needs.prepare.result == 'success' && needs.prepare.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - run: npm ci
      - name: Validate release snapshot
        run: mise run check

  build:
    needs: [context, check, prepare]
    if: >-
      always() && !cancelled() && needs.context.result == 'success' && needs.check.result == 'success' &&
      ((inputs.verify_builds && github.event_name == 'workflow_dispatch' &&
        needs.context.outputs.check_sha == github.sha && needs.context.outputs.version != '') ||
       (!inputs.verify_builds && needs.prepare.result == 'success' && needs.prepare.outputs.version != ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: jev-grep
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: jev-grep
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: jev-grep.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: rust,python
      RELEASE_SHA: ${{ inputs.verify_builds && needs.context.outputs.check_sha || needs.prepare.outputs.release_sha }}
      RELEASE_VERSION: ${{ inputs.verify_builds && needs.context.outputs.version || needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - name: Validate release version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          if version != os.environ['RELEASE_VERSION']:
              raise SystemExit(f'Cargo version {version} does not match release version')
          PY
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: mise exec -- rustup target add --toolchain "$(mise current rust)" "$TARGET"
      - name: Build and smoke-test
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          cargo build --release --locked --target "$TARGET"
          test "$("target/$TARGET/release/$BINARY" --version)" = "jev-grep $RELEASE_VERSION"
          "target/$TARGET/release/$BINARY" --help
      - name: Package
        env:
          TAG: v${{ env.RELEASE_VERSION }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          target, binary = os.environ['TARGET'], os.environ['BINARY']
          name = f"jev-grep-{os.environ['TAG']}-{target}"
          Path('dist').mkdir()
          files = [(Path('target') / target / 'release' / binary, binary),
                   (Path('README.md'), 'README.md')]
          if binary.endswith('.exe'):
              with zipfile.ZipFile(f'dist/{name}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path, member in files:
                      archive.write(path, arcname=member)
          else:
              with tarfile.open(f'dist/{name}.tar.gz', 'w:gz') as archive:
                  for path, member in files:
                      archive.add(path, arcname=member)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.RELEASE_VERSION }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, release-check, build]
    if: >-
      always() && !cancelled() && !inputs.verify_builds && github.ref == 'refs/heads/main' &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.version != '' && needs.release-check.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: node,python
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          cache: false
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.prepare.outputs.version }}-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.prepare.outputs.version }}-x86_64-pc-windows-msvc
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PR_NUMBER: ${{ needs.prepare.outputs.release_pr_number }}
        run: npm run release:publish
