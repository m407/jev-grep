[package]
name = "laya-grep"
version = "0.1.0"
edition = "2024"
description = "Streaming semantic grep using the Laya typed-decision HTTP API"

[[bin]]
name = "lg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
