[package]
name = "jev-grep"
version = "1.0.0"
edition = "2024"
description = "Streaming semantic grep using Jev via OpenCode Zen"

[[bin]]
name = "jev-grep"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
